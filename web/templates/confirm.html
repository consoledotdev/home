<!DOCTYPE html>
<html lang="en" class="h-screen">
  {{template "head" "console.dev confirmation"}}
  <body class="bg-black text-white">
    {{template "header"}}
    <main>
      <div class="container mx-auto max-w-7xl px-4 lg:px-8 py-8">
        <h1 class="text-3xl lg:text-4xl">Thanks!</h1>

        <p class="text-lg lg:text-xl text-gray-300 mt-4">
          Thanks for signing up to the Console newsletter. Expect the first one
          in your inbox next Thursday.
        </p>
      </div>
    </main>
    {{if .HashedEmail}}
    <!-- Reddit Pixel: advanced matching and SignUp conversion event -->
    <script nonce="{{nonce}}">
      rdt('init', 't2_gmwfttts', { email: '{{.HashedEmail}}' });
      rdt('track', 'SignUp');
    </script>
    {{end}}
    {{template "footer"}}
  </body>
</html>
